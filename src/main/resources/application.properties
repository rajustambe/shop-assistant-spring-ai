spring.application.name=shop-assistant

# --- Slice 8: deployment ---
# Render/most PaaS inject the port to bind as $PORT; default 8080 locally.
server.port=${PORT:8080}
# Expose only the health endpoint (used by the load balancer / container healthcheck).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- LLM: Groq via its OpenAI-compatible API (free, fast) ---
# Reuses your existing Groq key. Set it in the shell before running:
#   export GROQ_API_KEY=gsk_...        (Git Bash)
#   $env:GROQ_API_KEY="gsk_..."        (PowerShell)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
# gpt-oss-20b is far more reliable at tool-calling than llama-3.3-70b on Groq
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.2

# Groq has no embeddings endpoint; we'll wire a separate embedding model in the RAG slice.
# Disable embedding auto-config for now so the app boots without it.
spring.ai.openai.embedding.enabled=false

# --- Slice 1: in-memory H2 database ---
# Hibernate creates the schema from the @Entity, THEN data.sql seeds it.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Optional: browse the DB at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:testdb)
spring.h2.console.enabled=true

# --- Slice 2 RAG vector store ---
# Leave BLANK to use the in-memory store (app still boots).
# To persist in pgvector, paste your FRESH Neon connection string here, e.g.:
#   shop.neon.url=postgresql://neondb_owner:PASSWORD@ep-xxx.neon.tech/neondb?sslmode=require
# (Contains a password — fine for local learning, do NOT commit to git.)
# An env var NEON_DATABASE_URL, if set, overrides this.
shop.neon.url=${NEON_DATABASE_URL:}

# --- Slice 5: MCP server ---
spring.ai.mcp.server.name=shop-assistant
spring.ai.mcp.server.version=1.0.0
# Transport: STREAMABLE = the modern MCP transport (single /mcp endpoint), vs the older SSE (two endpoints).
spring.ai.mcp.server.protocol=STREAMABLE
# Auth: clients must send "Authorization: Bearer <this>" to reach /mcp. Blank = auth disabled.
shop.mcp.token=shop-secret-token-abc123
